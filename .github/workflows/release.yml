name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            artifact: git-seek-linux-x64
          - os: macos-15-intel
            platform: osx-x86_64
            artifact: git-seek-osx-x86_64
          - os: macos-14
            platform: osx-arm64
            artifact: git-seek-osx-arm64
          - os: windows-latest
            platform: win-x64
            artifact: git-seek-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Linux/macOS build
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: make release

      # Windows build
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\build.ps1 -Release

      - name: List dist contents
        shell: bash
        run: ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.VERSION }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*
          body: |
            ## git-seek ${{ github.ref_name }}

            Semantic search for git commits.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Linux x64 | `git-seek-linux-x64-${{ github.ref_name }}.tar.gz` |
            | macOS Intel | `git-seek-osx-x86_64-${{ github.ref_name }}.tar.gz` |
            | macOS Apple Silicon | `git-seek-osx-arm64-${{ github.ref_name }}.tar.gz` |
            | Windows x64 | `git-seek-win-x64-${{ github.ref_name }}.zip` |

            ### Installation

            See [README](https://github.com/${{ github.repository }}#installation) for detailed instructions.

            ### Checksums (SHA256)

            ```
            $(cat release/checksums.txt)
            ```
          draft: false
          prerelease: false
